function pgHow(){
 return `<div class=cin>🎯 ${T('<b>Mục tiêu:</b> vượt 5 biome rồi hạ <b>Vua Tro</b> ở Trái Tim Tro. Mỗi biome là một chuỗi phòng đi một chiều (không quay lại): gần cuối có <b>Lửa Trại</b>, cuối cùng là <b>boss</b>. Chết là mất run, nhưng Tàn Hồn, Mastery và đồ đã mở vẫn được giữ.','<b>Goal:</b> clear 5 biomes, then beat the <b>Ash King</b> in the Heart of Ash. Each biome is a one-way chain of rooms (no going back): a <b>Campfire</b> near the end, a <b>boss</b> last. Dying ends the run, but Soul Embers, Mastery and unlocks are kept.')}</div>
<h3>${T('Điều khiển','Controls')}</h3>
${cd('📱 '+T('Cảm ứng','Touch'),'',T(`Kéo ngón cái trái để di chuyển. ${kk('A')} đánh (giữ để đánh liên tục) · ${kk('H')} giữ khoảng 0.6s rồi thả = đòn nặng ×2.2 (thả sớm thì huỷ) · ${kk('D')} né · ${kk('Q')} ${kk('E')} kỹ năng class · ${kk('R')} Ember Surge · ${kk('F')} Ember Flask. Hai nút vật phẩm nằm dọc mép phải, phía trên.`,`Drag the left thumb to move. ${kk('A')} attack (hold to repeat) · ${kk('H')} hold ~0.6s then release = heavy attack ×2.2 (release early to cancel) · ${kk('D')} dash · ${kk('Q')} ${kk('E')} class skills · ${kk('R')} Ember Surge · ${kk('F')} Ember Flask. The two item buttons sit along the right edge, near the top.`))}
${cd('⌨️ '+T('Bàn phím','Keyboard'),'',T(`WASD di chuyển · ${kk('J')} đánh · ${kk('U')} đòn nặng (giữ rồi thả) · ${kk('Space')} hoặc ${kk('Shift')} né · ${kk('K')} = Q · ${kk('L')} = E · ${kk('R')} Surge · ${kk('F')} Flask · ${kk('1')} ${kk('2')} vật phẩm. Đổi phím trong Cài đặt.`,`WASD to move · ${kk('J')} attack · ${kk('U')} heavy (hold, then release) · ${kk('Space')} or ${kk('Shift')} dash · ${kk('K')} = Q · ${kk('L')} = E · ${kk('R')} Surge · ${kk('F')} Flask · ${kk('1')} ${kk('2')} items. Rebind keys in Settings.`))}
${cd('🎮 '+T('Tay cầm','Gamepad'),'',T('Cần trái di chuyển · A né · X / Y = Q / E · RT đánh · RB đòn nặng · LB Surge · D-pad ↑ Flask · Start tạm dừng.','Left stick to move · A dash · X / Y = Q / E · RT attack · RB heavy · LB Surge · D-pad ↑ Flask · Start to pause.'))}
<h3>${T('Chiến đấu','Combat')}</h3>
${cd(kk('D')+'Dash',T('2 lần, hồi dần','2 charges, recharging'),T('Lao nhanh, bất tử trong phần lớn lúc lao. Có 2 lần Dash, hồi dần theo thời gian (relic Đôi Cánh Sáp +1 lần). Né đúng khoảnh khắc đòn sắp trúng là <b>Perfect Dodge</b>: +8% Ember Surge.','A fast dash, invulnerable for most of the movement. You have 2 charges that recharge over time (the Wings of Wax relic adds 1). Dashing at the exact moment a hit would land is a <b>Perfect Dodge</b>: +8% Ember Surge.'))}
${cd('🟥🟨🟪 '+T('Báo hiệu đòn địch','Enemy telegraphs'),'',T('<b>ĐỎ</b> = né hoặc chặn được · <b>VÀNG</b> = Parry được (Ashblade / Ironwarden bấm E đúng lúc) · <b>TÍM</b> = không chặn được, bắt buộc né.','<b>RED</b> = dodge or block · <b>YELLOW</b> = can be parried (Ashblade / Ironwarden press E on time) · <b>PURPLE</b> = cannot be blocked, you must dodge.'))}
${cd('💥 '+T('Thế (làm địch choáng)','Poise (stunning enemies)'),'',T('Mỗi đòn trúng làm giảm thanh Thế của địch thường; hết Thế → địch choáng 2s. Đòn trúng cũng ngắt đòn đang báo hiệu. Đòn nặng và cộng hưởng Cận chiến (≥5 relic) làm vỡ Thế nhanh hơn. Boss không bị vỡ Thế.','Every hit drains a normal enemy’s Poise bar; when it empties the enemy is stunned for 2s. A hit also interrupts an attack that is winding up. Heavy attacks and the Melee resonance (5+ relics) break Poise faster. Bosses cannot be poise-broken.'))}
<h3>${T('Kỹ năng dùng chung mọi class','Skills shared by every class')}</h3>
${cd(kk('R')+'Ember Surge',T('thanh vàng dưới thanh máu','gold bar under your HP'),T('<b>Nạp:</b> gây sát thương (cứ 40 sát thương = 1%), Parry +10%, Perfect Dodge +8%, Đền Lửa đầy ngay. <b>Bấm R khi đủ 100%:</b> nổ quanh người (bán kính ~3 ô, ×2.5 sát thương) và buff 8s: +25% sát thương, +20% tốc đánh, hồi chiêu Q/E nhanh gấp đôi. Xả xong thanh về 0.','<b>Charge:</b> dealing damage (every 40 damage = 1%), Parry +10%, Perfect Dodge +8%, Shrine of Fire fills it instantly. <b>Press R at 100%:</b> a blast around you (~3-tile radius, ×2.5 damage) plus an 8s buff: +25% damage, +20% attack speed, Q/E cooldowns tick twice as fast. The bar resets to 0.'))}
${cd(kk('F')+'Ember Flask',T('bình hồi máu','healing flask'),T('Hồi 35% máu tối đa trong khoảng 0.8s (hồi dần). Có 2 bình mỗi run (độ khó cao: chỉ 1). Không dùng được khi đầy máu. Bước vào Lửa Trại sẽ nạp đầy lại.','Restores 35% of max HP over about 0.8s. You carry 2 flasks per run (high difficulty: only 1). Cannot be used at full HP. Entering a Campfire refills it.'))}
<h3>Mastery</h3>
${cd('⭐ '+T('Lên cấp riêng cho từng class','Levels per class'),'',T('Nhận XP: <b>+1</b> mỗi phòng đã qua · <b>+20</b> khi hạ boss · <b>+50</b> khi thắng run (<b>+100</b> thêm ở lần thắng đầu tiên bằng class đó). Mastery mở Aspect (Lv 4 / 8 / 12) và vũ khí (Lv 3 / 10) — xem trang Class.','XP: <b>+1</b> per room cleared · <b>+20</b> for killing a boss · <b>+50</b> for winning a run (<b>+100</b> extra on your first win with that class). Mastery unlocks Aspects (Lv 4 / 8 / 12) and weapons (Lv 3 / 10) — see the Class page.'))}`;
}

function pgElem(){
 return `<div class=cin>${T('Mỗi đòn trúng có <b>14%</b> cơ hội gây trạng thái nguyên tố của class: <b>Ashblade & Cinder Mage → Burn 🔥</b> · <b>Shadow Archer → Poison ☠</b> · <b>Ironwarden → Shock ⚡</b>. Biểu tượng và số chồng hiện trên đầu địch. Trạng thái kéo dài 3s (boss 1.5s), trúng thêm sẽ làm mới giờ; hết giờ thì mọi chồng biến mất cùng lúc. Relic <b>Lò Than Sống</b> tăng Burn thêm 1 chồng và +25–40% sát thương.','Every hit has a <b>14%</b> chance to apply your class element: <b>Ashblade & Cinder Mage → Burn 🔥</b> · <b>Shadow Archer → Poison ☠</b> · <b>Ironwarden → Shock ⚡</b>. Icons and stack counts show above enemies. A status lasts 3s (boss 1.5s) and each new application refreshes the timer; when it runs out every stack disappears at once. The <b>Living Brazier</b> relic adds +1 Burn stack and +25-40% Burn damage.')}</div>
<h3>${T('Trạng thái','Statuses')}</h3>
${cd('🔥 Burn',T('tối đa 3 chồng','max 3 stacks'),T('Cứ 0.5s gây sát thương bằng 12% sát thương của đòn gây ra × số chồng.','Every 0.5s deals 12% of the applying hit’s damage × stacks.'),'#ff7a2e')}
${cd('☠ Poison',T('tối đa 10 chồng','max 10 stacks'),T('Cứ 0.5s gây 10% × số chồng. Chồng càng cao càng đau.','Every 0.5s deals 10% × stacks. High stacks hurt a lot.'),'#8be04e')}
${cd('🩸 Bleed',T('tối đa 5 chồng','max 5 stacks'),T('Cứ 0.5s gây 20% × số chồng, <b>×2 nếu mục tiêu đang di chuyển</b>. Nguồn: đòn chí mạng của Ashblade khi cầm Song Đao Than.','Every 0.5s deals 20% × stacks, <b>×2 if the target is moving</b>. Source: Ashblade crits while wielding the Twin Cinder Blades.'),'#d8402e')}
${cd('❄ Chill',T('tối đa 3 chồng','max 3 stacks'),T('Mỗi chồng làm địch chậm di chuyển khoảng 20%. Đủ 3 chồng → <b>Đóng băng</b>: choáng 1.5s. Nguồn: Frost Nova của Cinder Mage (2 chồng cho mọi địch trong 4 ô).','Each stack slows enemy movement by about 20%. At 3 stacks → <b>Freeze</b>: stunned for 1.5s. Source: Cinder Mage’s Frost Nova (2 stacks to every enemy within 4 tiles).'),'#7fd8ff')}
${cd('⚡ Shock',T('1 chồng','1 stack'),T('Không gây sát thương riêng. (Relic Găng Sấm: mỗi 5 đòn, sét lan 60% sang 2–4 địch gần.)','Deals no damage by itself. (Thunder Gauntlet relic: every 5 hits, lightning chains 60% to 2-4 nearby enemies.)'),'#ffe34d')}
